[project]
name = "llama-buddy"
version = "0.1.13"
description = "CLI wrapper for llama.cpp providing an ollama-like experience"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Thilo Michael", email = "thilo.michael@bdr.de" }
]
requires-python = ">=3.10"
keywords = ["llama.cpp", "llm", "cli", "gguf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
llb = "llama_buddy.cli:main"

[project.urls]
Homepage = "https://github.com/thilomichael/llama-buddy"
Repository = "https://github.com/thilomichael/llama-buddy"
Issues = "https://github.com/thilomichael/llama-buddy/issues"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
